<script type="module">
   import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
   import {getDatabase, ref, push} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

   const firebaseConfig = {
  apiKey: "AIzaSyAVWLIDjsmMcH2kfqiKwQ1-jFU6d6654pY",
  authDomain: "myproject-fdb4c.firebaseapp.com",
  databaseURL: "https://myproject-fdb4c-default-rtdb.firebaseio.com",
  projectId: "myproject-fdb4c",
  storageBucket: "myproject-fdb4c.firebasestorage.app",
  messagingSenderId: "600134367178",
  appId: "1:600134367178:web:ea8b0daa3928c7791c8133"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

document.addEventListener("DOMContentLoaded", () => {

   // --- Sidebar Elements ---
   const toggleBtn = document.getElementById("toggleSidebar");
   const sidebar = document.getElementById("sidebar");
   const overlay = document.getElementById("sidebar-overlay");

   function isDesktop() {
      return window.innerWidth >= 1024;
   }

   // Set initial explicit collapsed/expanded classes based on viewport
   function initSidebarState() {
      if (isDesktop()) {
         // On desktop, sidebar starts visible
         toggleBtn.setAttribute("aria-expanded", "true");
         sidebar.classList.remove("lg:w-0", "lg:min-w-0", "lg:overflow-hidden");
         sidebar.classList.add("lg:w-[264px]", "lg:min-w-[264px]");
      } else {
         // On mobile, sidebar starts hidden
         toggleBtn.setAttribute("aria-expanded", "false");
         sidebar.classList.remove("translate-x-0");
         sidebar.classList.add("-translate-x-full");
      }
   }

   function openSidebar() {
      toggleBtn.setAttribute("aria-expanded", "true");
      if (isDesktop()) {
         sidebar.classList.remove("lg:w-0", "lg:min-w-0", "lg:overflow-hidden");
         sidebar.classList.add("lg:w-[264px]", "lg:min-w-[264px]");
      } else {
         sidebar.classList.remove("-translate-x-full");
         sidebar.classList.add("translate-x-0");
         if (overlay) {
            overlay.classList.remove("opacity-0", "pointer-events-none");
            overlay.classList.add("opacity-100", "pointer-events-auto");
         }
      }
   }

   function closeSidebar() {
      toggleBtn.setAttribute("aria-expanded", "false");
      if (isDesktop()) {
         sidebar.classList.remove("lg:w-[264px]", "lg:min-w-[264px]");
         sidebar.classList.add("lg:w-0", "lg:min-w-0", "lg:overflow-hidden");
      } else {
         sidebar.classList.remove("translate-x-0");
         sidebar.classList.add("-translate-x-full");
         if (overlay) {
            overlay.classList.remove("opacity-100", "pointer-events-auto");
            overlay.classList.add("opacity-0", "pointer-events-none");
         }
      }
   }

   // Corrected Click Event Listener
   toggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const isExpanded = toggleBtn.getAttribute("aria-expanded") === "true";
      // If currently expanded -> close it; if currently collapsed -> open it
      if (isExpanded) {
         closeSidebar();
      } else {
         openSidebar();
      }
   });

   if (overlay) {
      overlay.addEventListener("click", closeSidebar);
   }

   // Initialize correct state immediately on load
   initSidebarState();

   // Handle Window Resize
   window.addEventListener("resize", () => {
      if (isDesktop()) {
         if (overlay) {
            overlay.classList.remove("opacity-100", "pointer-events-auto");
            overlay.classList.add("opacity-0", "pointer-events-none");
         }
      }
   });

   // --- Search Toggle Logic ---
   const searchToggleBtn = document.getElementById("searchToggle");
   const searchBox = document.getElementById("searchBox");
   const searchWrapper = document.getElementById("searchWrapper");

   if (searchToggleBtn && searchBox) {
      searchToggleBtn.addEventListener("click", (e) => {
         e.stopPropagation();
         const isHidden = searchBox.classList.contains("max-lg:hidden") || searchBox.classList.contains("hidden");

         if (isHidden) {
            searchBox.classList.remove("max-lg:hidden", "hidden");
            searchBox.classList.add("flex", "absolute", "right-0", "top-full", "mt-2", "w-64", "z-50", "shadow-lg", "bg-white");
            const input = searchBox.querySelector("input");
            if (input) input.focus();
         } else {
            resetSearch();
         }
      });
   }

   function resetSearch() {
      if (searchBox) {
         searchBox.classList.add("max-lg:hidden");
         searchBox.classList.remove("flex", "absolute", "right-0", "top-full", "mt-2", "w-64", "z-50", "shadow-lg");
      }
   }

   document.addEventListener("click", (e) => {
      if (searchWrapper && !searchWrapper.contains(e.target)) {
         resetSearch();
      }
   });

   // --- Profile Dropdown Logic ---
   const profileToggle = document.getElementById("dropdown-toggle");
   const profileMenu = document.getElementById("dropdown-menu");
   const profileLinks = profileMenu ? profileMenu.querySelectorAll(".dropdown-item") : [];

   function showProfileMenu() {
      if (profileMenu) {
         profileMenu.classList.remove("hidden");
         profileMenu.classList.add("block");
         profileToggle.setAttribute("aria-expanded", "true");
      }
   }

   function hideProfileMenu() {
      if (profileMenu) {
         profileMenu.classList.add("hidden");
         profileMenu.classList.remove("block");
         profileToggle.setAttribute("aria-expanded", "false");
      }
   }

   if (profileToggle) {
      profileToggle.addEventListener("click", (e) => {
         e.stopPropagation();
         const isExpanded = profileToggle.getAttribute("aria-expanded") === "true";
         isExpanded ? hideProfileMenu() : showProfileMenu();
      });
   }

   document.addEventListener("click", (e) => {
      if (profileMenu && !profileMenu.contains(e.target) && e.target !== profileToggle) {
         hideProfileMenu();
      }
   });

   profileLinks.forEach(link => link.addEventListener("click", hideProfileMenu));

   // Keyboard accessibility (ESC key)
   document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
         hideProfileMenu();
         resetSearch();
         if (!isDesktop() && toggleBtn.getAttribute("aria-expanded") === "true") {
            closeSidebar();
         }
      }
   });

   // --- Collapsible Submenus Logic ---
   document.querySelectorAll(".collapsible-toggle").forEach((btn) => {
      btn.addEventListener("click", function () {
         const menu = this.nextElementSibling;
         if (!menu) return;

         const arrowIcon = this.querySelector(".arrow");
         const isOpen = menu.offsetHeight > 0;

         if (isOpen) {
            menu.style.maxHeight = "0px";
            if (arrowIcon) arrowIcon.classList.add("-rotate-90");
            this.setAttribute("aria-expanded", "false");
         } else {
            menu.style.maxHeight = menu.scrollHeight + "px";
            if (arrowIcon) arrowIcon.classList.remove("-rotate-90");
            this.setAttribute("aria-expanded", "true");
         }
      });
   });
});

// Register Service Worker
async function registerServiceWorker() {
    const registration = await navigator.serviceWorker.register("/service-worker.js");
    console.log("Service Worker registered");
    return registration;
}
// Convert VAPID key
function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 =
        (base64String + padding)
            .replace(/-/g, "+")
            .replace(/_/g, "/");
    const rawData =window.atob(base64);
    return Uint8Array.from(
        [...rawData].map(char => char.charCodeAt(0))
    );
}

      return;
   }else{
      try {
         if (!window.isSecureContext || !("serviceWorker" in navigator) || !("PushManager" in window)) {
            throw new Error("Push notifications require HTTPS or localhost.");
         }

         const permission = await Notification.requestPermission();
         if (permission !== "granted") {
            alert("Notification permission denied");
            return;
         }

         const registration = await registerServiceWorker();
         const publicKey = "BFKtDIwBjMBUdIoEP5mgv14ak4M3DUSvmRbwLpapdCRorgUS7yx8DVUTxA0_iSVOcEQf_xQjljc3mgYTkuqPuRI";
         const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey)
         });
         const subscriptionData = subscription.toJSON();
        const response = await fetch("/subscribe", {
            method: "POST",
            headers: {
               "Content-Type": "application/json"
            },
            body: JSON.stringify({
               ...subscriptionData,
               name: name.value.trim(),
               mobile: mobile.value.trim(),
               email: email.value.trim()
            })
         });
         if (!response.ok) {
            throw new Error(`Server rejected subscription (${response.status}).`);
         }

         await push(ref(db, "owners"), {
            name: name.value.trim(),
            mobile: mobile.value.trim(),
            email: email.value.trim(),
            notificationSubscription: subscriptionData,
            createdAt: new Date().toISOString()
         });
         alert("Notifications enabled!");
      } catch (error) {
         console.error("Subscription failed:", error);
         alert(`Could not enable notifications: ${error.message}`);
      }
   }
});
